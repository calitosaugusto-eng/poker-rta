name: Build APK and Deploy API

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  # Job 1: Deploy Cloudflare Workers API
  deploy-api:
    runs-on: ubuntu-latest
    name: Deploy API to Cloudflare Workers
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler deploy workers/index.ts

  # Job 2: Deploy Frontend to Cloudflare Pages
  deploy-web:
    runs-on: ubuntu-latest
    name: Deploy Web App to Cloudflare Pages
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install

      - name: Build Next.js (static export)
        run: bun run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy out --project-name=poker-rta

  # Job 3: Build Android APK
  build-apk:
    runs-on: ubuntu-latest
    name: Build Android APK
    needs: deploy-api
    permissions:
      contents: write
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Instalar dependências
        run: bun install

      - name: Build Next.js (static export)
        run: bun run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build APK Debug
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: poker-rta-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Get version name
        id: version
        run: echo "VERSION=1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Create Release with APK
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Poker RTA v${{ steps.version.outputs.VERSION }}
          body: |
            ## Poker RTA - Real-Time Assistance

            ### Como instalar:
            1. Baixe o APK abaixo
            2. Permita instalação de fontes desconhecidas nas configurações
            3. Instale o app
            4. Toque em "Capturar Tela" e permita o acesso

            ### Funcionalidades:
            - ✅ Captura de tela nativa Android
            - ✅ Detecção automática de cartas (1 segundo)
            - ✅ Análise matemática (pot odds, equity, EV)
            - ✅ Recomendações de jogada
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
